name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Command and steps
      description: The exact command line, and what you did next.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bluehour version
      description: Output of `bluehour --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Connected devices
      description: DK2 (and its camera), Wii Remotes, gamepads, Bluetooth adapter.
  - type: textarea
    id: log
    attributes:
      label: Output of `bluehour --debug`
      render: text
