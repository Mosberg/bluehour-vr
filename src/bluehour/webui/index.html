<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluehour</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#panel">Skip to content</a>
<header class="top">
  <img class="brand" src="logo-dark.svg" alt="Bluehour">
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Connecting</span></div>
  <div class="top-actions">
    <button class="btn primary" id="btn-start" type="button">Start player</button>
    <button class="btn" id="btn-stop" type="button" hidden>Stop</button>
    <button class="btn quiet" id="btn-quit" type="button" title="Stop the player and close this control panel">Quit</button>
  </div>
</header>

<div class="shell">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="panel" tabindex="-1">
    <div class="banner" id="restart-banner" hidden>
      <span id="restart-text"></span>
      <button class="btn small" id="btn-restart" type="button">Restart player</button>
    </div>
    <noscript>This control panel needs JavaScript.</noscript>
    <div id="panels"></div>
  </main>
</div>

<section class="remote" id="remote" aria-label="Player remote" hidden>
  <div class="remote-row">
    <button class="icon" data-act="prev" title="Previous file" aria-label="Previous file">&#9198;</button>
    <button class="icon" data-act="long_back" title="Back 60 seconds" aria-label="Back 60 seconds">-60</button>
    <button class="icon" data-act="seek_back" title="Back 10 seconds" aria-label="Back 10 seconds">-10</button>
    <button class="icon big" id="r-pause" data-act="pause" title="Pause or play" aria-label="Pause or play">&#9658;</button>
    <button class="icon" data-act="seek_fwd" title="Forward 10 seconds" aria-label="Forward 10 seconds">+10</button>
    <button class="icon" data-act="long_fwd" title="Forward 60 seconds" aria-label="Forward 60 seconds">+60</button>
    <button class="icon" data-act="next" title="Next file" aria-label="Next file">&#9197;</button>
    <div class="seek">
      <span id="r-time">0:00</span>
      <input id="r-seek" type="range" min="0" max="100" step="1" value="0" aria-label="Position">
      <span id="r-dur">0:00</span>
    </div>
    <div class="vol">
      <button class="icon" id="r-mute" data-act="mute" title="Mute" aria-label="Mute">&#128266;</button>
      <input id="r-vol" type="range" min="0" max="130" step="1" value="80" aria-label="Volume">
    </div>
    <button class="btn small" data-act="recenter" title="Recenter the view and position">Recenter</button>
    <button class="btn small" data-act="subtitles" title="Next subtitle track">Subtitles</button>
    <button class="btn small" data-act="audio" title="Next audio track">Audio track</button>
  </div>
  <div class="now" id="r-now"></div>
</section>

<dialog id="picker" aria-labelledby="picker-title">
  <form method="dialog" class="picker">
    <h2 id="picker-title">Choose videos</h2>
    <div class="picker-bar">
      <button type="button" class="btn small" id="pk-up" title="Parent folder">Up</button>
      <button type="button" class="btn small" id="pk-home">Home</button>
      <select id="pk-roots" aria-label="Drive or root"></select>
      <input id="pk-path" type="text" spellcheck="false" aria-label="Folder path">
    </div>
    <label class="check"><input type="checkbox" id="pk-all"> Show all files</label>
    <ul id="pk-list" class="pk-list"></ul>
    <p class="muted" id="pk-msg"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" id="pk-add" value="add" type="button">Add selected</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="alert" hidden></div>
<script src="app.js"></script>
</body>
</html>
